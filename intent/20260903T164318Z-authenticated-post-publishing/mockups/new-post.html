<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Create post</title></head>
  <body>
    <header><nav aria-label="Primary"><a href="public-posts.html">Posts</a><a href="my-posts.html">My posts</a></nav></header>
    <main>
      <h1>Create post</h1>
      <form action="#" method="post">
        <p><label for="title">Title</label><br><input id="title" name="post[title]" required></p>
        <p><label for="url">Original URL (optional)</label><br><input id="url" name="post[url]" type="text" inputmode="url" placeholder="google.com"></p>
        <p><label for="body">Body (optional)</label><br><textarea id="body" name="post[body]"></textarea></p>
        <button type="submit">Create post</button>
      </form>
    </main>
  </body>
</html>
